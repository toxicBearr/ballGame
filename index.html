<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шар на склоне</title>
<style>
:root{--bg:#dfe6e4;--plane:#2f6f68;--edge:#1d4a45;--goal:#101a19;--fg:#14211f;--ball:#f2f0ea;--ball2:#d9542f;
 box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1716;--plane:#2a6159;--edge:#173c37;--goal:#050908;--fg:#d8e6e3;--ball:#ece9e0;--ball2:#e0643f}}
:root[data-theme="dark"]{--bg:#0f1716;--plane:#2a6159;--edge:#173c37;--goal:#050908;--fg:#d8e6e3;--ball:#ece9e0;--ball2:#e0643f}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
 display:flex;justify-content:space-between;align-items:baseline;pointer-events:none;font-size:15px}
#msg{font-weight:600;font-size:20px}
#hint{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);
 text-align:center;font-size:14px;opacity:.7;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="msg"></span><span id="time">0.0 с</span></div>
<div id="hint">Ведите пальцем: резинка тянет шар к касанию, а склон тянет его вниз</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var S=0.5, N=14, M=22, W=N*S, L=M*S, R=0.4, TILT=22*Math.PI/180;
  var G=9.8*Math.sin(TILT)*5/7, PULL=14, PULLMAX=18, DAMP=0.9, SLACK=0.35, E=0.45, GR=0.52, LEVELS=10;
  var css=function(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()};

  var canvas=document.getElementById('c');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(45,1,0.1,100);
  camera.position.set(0,11,13.5); camera.lookAt(0,-0.5,0);
  scene.add(new THREE.AmbientLight(0xffffff,0.65));
  var sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(4,10,6); scene.add(sun);

  var slope=new THREE.Group(); slope.rotation.x=TILT; scene.add(slope);
  var mPlane=new THREE.MeshLambertMaterial(), mEdge=new THREE.MeshLambertMaterial(), mGoal=new THREE.MeshBasicMaterial();
  var hitPlane=new THREE.Mesh(new THREE.BoxGeometry(W,0.1,L),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  hitPlane.position.y=-0.05; slope.add(hitPlane);
  var goal=new THREE.Mesh(new THREE.CircleGeometry(GR,40),mGoal);
  goal.rotation.x=-Math.PI/2; slope.add(goal);

  var tex=(function(){var c=document.createElement('canvas');c.width=128;c.height=64;var x=c.getContext('2d');
    x.fillStyle=css('--ball');x.fillRect(0,0,128,64);x.fillStyle=css('--ball2');
    for(var i=0;i<8;i++)for(var j=0;j<4;j++)if((i+j)%2===0)x.fillRect(i*16,j*16,16,16);
    return new THREE.CanvasTexture(c);})();
  var ball=new THREE.Mesh(new THREE.SphereGeometry(R,32,24),new THREE.MeshLambertMaterial({map:tex}));
  slope.add(ball);
  var mBand=new THREE.MeshLambertMaterial({color:0xe0643f});
  var band=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,10),mBand); band.visible=false; slope.add(band);
  var anchor=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.06,24),mBand); anchor.visible=false; slope.add(anchor);
  var va=new THREE.Vector3(), vb=new THREE.Vector3(), vd=new THREE.Vector3(), vn=new THREE.Vector3(), yAxis=new THREE.Vector3(0,1,0);

  function theme(){
    renderer.setClearColor(new THREE.Color(css('--bg')));
    mPlane.color.set(css('--plane')); mEdge.color.set(css('--edge')); mGoal.color.set(css('--goal')); mBand.color.set(css('--ball2'));
  }
  theme();
  if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){theme();});
  function resize(){
    var w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.fov=w/h<0.8?60:45; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize); resize();

  /* ---------- уровни: сетка клеток, 1 = пол, 0 = стена ---------- */
  var grid, floorM=null, wallM=null, gx=0, gz=0, gcx=0, gamp=0, gw=1;
  function cx(i){return (i+0.5)*S-W/2}
  function cz(j){return (j+0.5)*S-L/2}
  function fl(i,j){return i>=0&&j>=0&&i<N&&j<M&&grid[j*N+i]===1}
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}

  // s: r=прямоугольник, c=извилистый коридор, h=«песочные часы», d=ромб, b=блок посередине, z=змейка
  var CFG=[{s:'r'},{s:'c',hw:2},{s:'h',p:3},{s:'d'},{s:'b'},{s:'c',hw:1},{s:'h',p:5},{s:'d',p:3},{s:'z'},{s:'r',p:9,mg:2}];
  function pillars(n,mg){
    var np=0,t,a,b,pi,pj,ok;
    for(t=0;t<300&&np<n;t++){
      pi=rnd(3,N-5); pj=rnd(6,M-8); ok=true;
      for(b=pj-mg;b<=pj+1+mg&&ok;b++)for(a=pi-mg;a<=pi+1+mg;a++)if(!fl(a,b)){ok=false;break;}
      if(ok){grid[pj*N+pi]=grid[pj*N+pi+1]=grid[(pj+1)*N+pi]=grid[(pj+1)*N+pi+1]=0;np++;}
    }
  }
  function gen(lv){
    grid=new Uint8Array(N*M); var C=CFG[lv], i,j,k,gi=N/2;
    if(C.s==='c'){
      var c=N/2, tg=rnd(3,N-4);
      for(j=M-2;j>=1;j--){
        if(Math.abs(c-tg)<1)tg=rnd(3,N-4);
        if(C.hw>1||j%2===0)c+=c<tg?1:-1;
        for(i=Math.floor(c)-C.hw;i<=Math.floor(c)+C.hw;i++)if(i>=1&&i<=N-2)grid[j*N+i]=1;
        if(j===3)gi=Math.floor(c);
      }
    } else if(C.s==='h'){
      var ph=Math.random()*6.28, fr=0.25+Math.random()*0.15;
      for(j=1;j<M-1;j++){var hw=4+2*Math.sin(j*fr+ph);
        for(i=1;i<N-1;i++)if(Math.abs(i+0.5-N/2)<=hw)grid[j*N+i]=1;}
    } else if(C.s==='d'){
      for(j=1;j<M-1;j++){var hd=1.5+4.5*(1-Math.abs(j+0.5-M/2)/(M/2));
        for(i=1;i<N-1;i++)if(Math.abs(i+0.5-N/2)<=hd)grid[j*N+i]=1;}
    } else {
      for(j=1;j<M-1;j++)for(i=1;i<N-1;i++)grid[j*N+i]=1;
      if(C.s==='b')for(j=7;j<=14;j++)for(i=5;i<=8;i++)grid[j*N+i]=0;
      if(C.s==='z')for(k=0;k<3;k++)for(i=1;i<N-1;i++){
        var inGap=(k%2===0)?(i>=8):(i<=5);
        if(!inGap)grid[(17-5*k)*N+i]=0;
      }
    }
    pillars(C.p||0,C.mg||3);
    var a0=gi, b0=gi; while(fl(a0-1,3))a0--; while(fl(b0+1,3))b0++;
    gcx=(cx(a0)+cx(b0))/2; gx=gcx; gz=cz(3);
  }

  function build(){
    if(floorM){slope.remove(floorM);slope.remove(wallM);floorM.geometry.dispose();wallM.geometry.dispose();}
    var nf=0,nw=0,i,j,a,b,w;
    function isWall(i,j){
      if(fl(i,j))return false;
      for(b=-1;b<=1;b++)for(a=-1;a<=1;a++)if(fl(i+a,j+b))return true;
      return false;
    }
    for(j=0;j<M;j++)for(i=0;i<N;i++){if(fl(i,j))nf++;else if(isWall(i,j))nw++;}
    floorM=new THREE.InstancedMesh(new THREE.BoxGeometry(S,0.3,S),mPlane,nf);
    wallM=new THREE.InstancedMesh(new THREE.BoxGeometry(S,0.45,S),mEdge,nw);
    var m=new THREE.Matrix4(), kf=0, kw=0;
    for(j=0;j<M;j++)for(i=0;i<N;i++){
      if(fl(i,j)){m.setPosition(cx(i),-0.15,cz(j));floorM.setMatrixAt(kf++,m);}
      else if(isWall(i,j)){m.setPosition(cx(i),0.07,cz(j));wallM.setMatrixAt(kw++,m);}
    }
    slope.add(floorM); slope.add(wallM);
    goal.position.set(gx,0.012,gz);
  }

  function collide(){
    var ci=Math.floor((p.x+W/2)/S), cj=Math.floor((p.z+L/2)/S), rr=Math.ceil(R/S)+1;
    for(var j=cj-rr;j<=cj+rr;j++)for(var i=ci-rr;i<=ci+rr;i++){
      if(fl(i,j))continue;
      var x0=i*S-W/2, z0=j*S-L/2, x1=x0+S, z1=z0+S;
      var qx=Math.max(x0,Math.min(p.x,x1)), qz=Math.max(z0,Math.min(p.z,z1));
      var dx=p.x-qx, dz=p.z-qz, d=Math.sqrt(dx*dx+dz*dz);
      if(d<R){
        if(d<1e-6){dx=p.x-(x0+x1)/2;dz=p.z-(z0+z1)/2;d=Math.sqrt(dx*dx+dz*dz)||1;}
        var nx=dx/d, nz=dz/d;
        p.x+=nx*(R-d); p.z+=nz*(R-d);
        var vnn=v.x*nx+v.z*nz;
        if(vnn<0){v.x-=(1+E)*vnn*nx; v.z-=(1+E)*vnn*nz;}
      }
    }
  }

  /* ---------- хаотичная лунка: блуждает по полу, отражается от стен ---------- */
  var g={x:0,z:0,th:0,ph:0,gs:3,zmax:0};
  function stepGoal(dt,t){
    g.th+=(Math.random()-0.5)*30*dt;                                   // плавное блуждание курса
    if(Math.random()<0.7*dt)g.th+=(Math.random()<0.5?-1:1)*(1+Math.random()*1.5); // внезапные повороты
    var sp=g.gs*(0.75+0.45*Math.sin(t*2.3+g.ph));                      // скорость «дышит»
    var vx=Math.cos(g.th)*sp, vz=Math.sin(g.th)*sp;
    g.x+=vx*dt; g.z+=vz*dt;
    var ci=Math.floor((g.x+W/2)/S), cj=Math.floor((g.z+L/2)/S), rr=Math.ceil(GR/S)+1;
    for(var j=cj-rr;j<=cj+rr;j++)for(var i=ci-rr;i<=ci+rr;i++){
      if(fl(i,j))continue;
      var x0=i*S-W/2, z0=j*S-L/2, x1=x0+S, z1=z0+S;
      var qx=Math.max(x0,Math.min(g.x,x1)), qz=Math.max(z0,Math.min(g.z,z1));
      var dx=g.x-qx, dz=g.z-qz, d=Math.sqrt(dx*dx+dz*dz);
      if(d<GR){
        if(d<1e-6){dx=g.x-(x0+x1)/2;dz=g.z-(z0+z1)/2;d=Math.sqrt(dx*dx+dz*dz)||1;}
        var nx=dx/d, nz=dz/d;
        g.x+=nx*(GR-d); g.z+=nz*(GR-d);
        var vq=vx*nx+vz*nz;
        if(vq<0){vx-=2*vq*nx; vz-=2*vq*nz; g.th=Math.atan2(vz,vx);}
      }
    }
    if(g.z>g.zmax){g.z=g.zmax; if(Math.sin(g.th)>0)g.th=-g.th;}       // не уходит слишком низко
  }

  /* ---------- состояние и ввод ---------- */
  var p={x:0,z:0}, v={x:0,z:0}, lv=0;
  var touching=false, ndc=new THREE.Vector2(), ray=new THREE.Raycaster(), target=null;
  var t0=performance.now(), won=false, winAt=0;
  var msg=document.getElementById('msg'), timeEl=document.getElementById('time'), hint=document.getElementById('hint');

  function load(l){
    lv=l; gen(l); build();
    g.x=gx; g.z=gz; g.th=Math.random()*6.28; g.ph=Math.random()*6.28;
    g.gs=2.6+0.25*l; g.zmax=cz(Math.min(8+Math.floor(l*0.8),15));
    p.x=cx(N/2); p.z=cz(M-2); v.x=v.z=0; won=false; t0=performance.now();
    msg.textContent='Уровень '+(l+1)+' из '+LEVELS;
  }
  function setPointer(e){ndc.set(e.clientX/window.innerWidth*2-1,-(e.clientY/window.innerHeight)*2+1);}
  canvas.addEventListener('pointerdown',function(e){touching=true;setPointer(e);canvas.setPointerCapture(e.pointerId);hint.style.opacity=0;});
  canvas.addEventListener('pointermove',function(e){if(touching)setPointer(e);});
  function up(){touching=false;target=null;}
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);

  load(0);
  var last=performance.now(), q=new THREE.Quaternion(), ax=new THREE.Vector3();
  function frame(now){
    var dt=Math.min((now-last)/1000,0.033); last=now;
    scene.updateMatrixWorld(true);
    target=null;
    if(touching&&!won){
      ray.setFromCamera(ndc,camera);
      var hit=ray.intersectObject(hitPlane)[0];
      if(hit){var lp=slope.worldToLocal(hit.point.clone()); target={x:lp.x,z:lp.z};}
    }
    if(!won){
      stepGoal(dt,(now-t0)/1000); gx=g.x; gz=g.z; goal.position.x=gx; goal.position.z=gz;
      var ax_=0, az=G;
      if(target){
        var dx=target.x-p.x, dz=target.z-p.z, d=Math.hypot(dx,dz)||1, f=Math.min(PULL*Math.max(d-SLACK,0),PULLMAX);
        ax_+=dx/d*f; az+=dz/d*f;
      }
      v.x+=ax_*dt; v.z+=az*dt;
      var k=Math.exp(-DAMP*dt); v.x*=k; v.z*=k;
      p.x+=v.x*dt; p.z+=v.z*dt;
      collide();
      if(Math.hypot(p.x-gx,p.z-gz)<GR*0.75){won=true;winAt=now;
        msg.textContent=(lv<LEVELS-1?'Уровень пройден! ':'Все уровни пройдены! ')+((now-t0)/1000).toFixed(1)+' с';}
      else timeEl.textContent=((now-t0)/1000).toFixed(1)+' с';
    } else {
      p.x+=(gx-p.x)*Math.min(dt*8,1); p.z+=(gz-p.z)*Math.min(dt*8,1);
      if(now-winAt>2000)load((lv+1)%LEVELS);
    }
    ball.position.set(p.x,won?R*0.5:R,p.z);
    if(target&&!won){
      va.set(target.x,0.05,target.z); vb.copy(ball.position); vd.subVectors(vb,va);
      var len=vd.length()||0.001; vn.copy(vd).normalize();
      band.visible=anchor.visible=true;
      band.position.copy(va).addScaledVector(vd,0.5);
      band.quaternion.setFromUnitVectors(yAxis,vn);
      var th=Math.max(0.025,0.11/(1+0.4*len));
      band.scale.set(th,len,th);
      anchor.position.set(target.x,0.03,target.z);
    } else { band.visible=anchor.visible=false; }
    var sp=Math.hypot(v.x,v.z);
    if(sp>1e-4){ax.set(v.z,0,-v.x).normalize();q.setFromAxisAngle(ax,sp*dt/R);ball.quaternion.premultiply(q);}
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
